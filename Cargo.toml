[package]
name = "mouse-recorder"
version = "0.4.0"
edition = "2021"

[dependencies]
device_query = "2"
rdev = { version = "0.5", features = ["unstable_grab"] }
chrono = "0.4"
xcap = "0.9"
image = "0.25"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
eframe = "0.30"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser"] }
