[package]
name = "mouse-recorder"
version = "0.5.2"
edition = "2021"

[dependencies]
device_query = "2"
rdev = { version = "0.5", features = ["unstable_grab"] }
chrono = "0.4"
image = "0.25"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
# glow: true window transparency on Windows (wgpu often paints black)
eframe = { version = "0.30", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
toml = "0.8"
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
# unwind: capture failures must not silently abort the process (windows subsystem)
panic = "unwind"
